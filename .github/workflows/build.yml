                  Math.random().toString(36).slice(2, 9);
              }
              function makeChat() {
                return {
                  id: makeId(),
                  title: 'Новый чат',
                  messages: [],
                  createdAt: Date.now(),
                  updatedAt: Date.now()
                };
              }

              function saveChats() {
                try {
                  localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify({
                      chats: chats,
                      activeChatId: activeChatId
                    })
                  );
                } catch (error) {
                  console.error('Чаты пошли по пизде:', error);
                  showDialog(
                    'Ошибка сохранения',
                    'Не удалось сохранить переписки на телефоне. ' +
                    'Возможно, закончилось место в хранилище.',
                    [{ text: 'Спасибо👍', action: closeDialog }]
                  );
                }
              }

              function loadChats() {
                try {
                  const saved = localStorage.getItem(STORAGE_KEY);

                  if (saved) {
                    const data = JSON.parse(saved);

                    if (Array.isArray(data.chats)) {
                      chats = data.chats.filter(item =>
                        item &&
                        typeof item.id === 'string' &&
                        typeof item.title === 'string' &&
                        Array.isArray(item.messages)
                      );
                    }

                    activeChatId = data.activeChatId;
                  }
                } catch (error) {
                  console.error('Не удалось загрузить чаты:', error);
                  chats = [];
                }

                if (!chats.length) {
                  const firstChat = makeChat();
                  chats.push(firstChat);
                  activeChatId = firstChat.id;
                  saveChats();
                }

                if (!chats.some(item => item.id === activeChatId)) {
                  activeChatId = chats[0].id;
                  saveChats();
                }
              }

              function currentChat() {
                return chats.find(item => item.id === activeChatId);
              }

              function renderChat() {
                chatElement.replaceChildren();

                const selected = currentChat();

                if (!selected) return;

                if (!selected.messages.length) {
                  appendMsg(
                    'Привет! Я Utopia AI. Введи токен доступа выше, ' +
                    'затем задай вопрос.',
                    'bot'
                  );
                } else {
                  selected.messages.forEach(message => {
                    appendMsg(
                      message.content,
                      message.role === 'user' ? 'user' : 'bot'
                    );
                  });
                }

                chatElement.scrollTop = chatElement.scrollHeight;
              }

              function appendMsg(text, role) {
                const div = document.createElement('div');
                div.className = 'msg ' + role;
                div.textContent = text;
                chatElement.appendChild(div);
                chatElement.scrollTop = chatElement.scrollHeight;
                return div;
              }

              function toggleMenu(force) {
                const shouldOpen = typeof force === 'boolean'
                  ? force
                  : menuPopup.hidden;

                menuPopup.hidden = !shouldOpen;
                menuBtn.setAttribute('aria-expanded', String(shouldOpen));
              }

              function closeDialog() {
                overlay.hidden = true;
                dialogContent.replaceChildren();
                dialogActions.replaceChildren();
              }

              function showDialog(title, message, actions) {
                dialogTitle.textContent = title;
                dialogContent.replaceChildren();
                dialogActions.replaceChildren();

                if (typeof message === 'string') {
                  const note = document.createElement('div');
                  note.className = 'empty-note';
                  note.textContent = message;
                  dialogContent.appendChild(note);
                } else if (message) {
                  dialogContent.appendChild(message);
                }

                (actions || []).forEach(item => {
                  const button = document.createElement('button');
                  button.type = 'button';
                  button.textContent = item.text;

                  if (item.secondary) {
                    button.className = 'secondary-btn';
                  }

                  button.addEventListener('click', item.action);
                  dialogActions.appendChild(button);
                });

                overlay.hidden = false;
              }

              function createNewChat() {
                const newChat = makeChat();
                chats.unshift(newChat);
                activeChatId = newChat.id;
                saveChats();
                renderChat();
              }

              function openHistory() {
                const list = document.createElement('div');
                if (!chats.length) {
                  list.textContent = 'Сохранённых чатов пока нет.';
                }

                chats
                  .slice()
                  .sort((a, b) => b.updatedAt - a.updatedAt)
                  .forEach(item => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'chat-entry' +
                      (item.id === activeChatId ? ' active' : '');

                    const firstUserMessage = item.messages.find(
                      message => message.role === 'user'
                    );

                    button.textContent =
                      item.title +
                      (firstUserMessage
                        ? '\n' + firstUserMessage.content.slice(0, 55)
                        : '\nПустой чат');

                    button.addEventListener('click', () => {
                      activeChatId = item.id;
                      saveChats();
                      renderChat();
                      closeDialog();
                    });

                    list.appendChild(button);
                  });

                showDialog(
                  'История текстовых окон',
                  list,
                  [{
                    text: 'Нахуй прикрыть',
                    action: closeDialog,
                    secondary: true
                  }]
                );
              }

              function renameChat() {
                const selected = currentChat();
                if (!selected) return;

                const field = document.createElement('input');
                field.className = 'dialog-input';
                field.value = selected.title;
                field.maxLength = 80;
                field.placeholder = 'Название чата';

                showDialog(
                  'Переименовать чат',
                  field,
                  [
                    {
                      text: 'Бля🥺',
                      action: closeDialog,
                      secondary: true
                    },
                    {
                      text: 'Закрепить результат',
                      action: () => {
                        const title = field.value.trim();

                        if (!title) {
                          field.focus();
                          return;
                        }

                        selected.title = title;
                        selected.updatedAt = Date.now();
                        saveChats();
                        closeDialog();
                      }
                    }
                  ]
                );

                field.focus();
                field.select();
              }

              function clearChat() {
                showDialog(
                  'Ну нееет🥺',
                  'Все сообщения текущего чата будут удалены. ' +
                  'Сам чат останется в истории.',
                  [
                    {
                      text: 'Нееет!',
                      action: closeDialog,
                      secondary: true
                    },
                    {
                      text: 'Да блять!',
                      action: () => {
                        const selected = currentChat();

                        if (selected) {
                          selected.messages = [];
                          selected.updatedAt = Date.now();
                          saveChats();
                        }

                        closeDialog();
                        renderChat();
                      }
                    }
                  ]
                );
              }

                            function openSettings() {
                const rememberCharacter =
                  localStorage.getItem(ANDI_MEMORY_KEY) !== 'false';

                showDialog(
                  'Настройки Анди',
                  'Помнить, с кем ведём диалог',
                  [
                    {
                      text: rememberCharacter
                        ? 'Включено ✓'
                        : 'Выключено',
                      action: () => {
                        localStorage.setItem(
                          ANDI_MEMORY_KEY,
                          rememberCharacter ? 'false' : 'true'
                        );
                        closeDialog();
                        openSettings();
                      }
                    },
                    {
                      text: 'Характеристики',
                      action: () => {
                        closeDialog();
                        showDialog(
                          'Характеристики Анди',
                          ANDRIALFUS_SYSTEM_PROMPT,
                          [{
                            text: 'Назад',
                            action: openSettings,
                            secondary: true
                          }]
                        );
                      }
                    },
                    {
                      text: 'Закрыть',
                      action: closeDialog,
                      secondary: true
                    }
                  ]
                );
              }

              menuBtn.addEventListener('click', () => {
                toggleMenu();
              });

              document.addEventListener('click', event => {
                if (!event.target.closest('#menu-wrap')) {
                  toggleMenu(false);
                }
              });

             menuPopup.addEventListener('click', event => {
                const button = event.target.closest('[data-action]');
                if (!button) return;

                toggleMenu(false);

                switch (button.dataset.action) {
                  case 'new':
                    createNewChat();
                    break;

                  case 'history':
                    openHistory();
                    break;

                  case 'rename':
                    renameChat();
                    break;

                  case 'clear':
                    clearChat();
                    break;

                  case 'settings':
                    openSettings();
                    break;
                }
              });

              overlay.addEventListener('click', event => {
                if (event.target === overlay) {
                  closeDialog();
                }
              });

              sendBtn.addEventListener('click', send);

              input.addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                  event.preventDefault();
                  send();
                }
              });

              async function send() {
                if (isSending) return;

                const text = input.value.trim();
                const appToken = keyInput.value.trim();
                const selected = currentChat();

                if (!text) return;

                if (!selected) return;

                if (!appToken) {
                  appendMsg(
                    'Где токен доступа Utopia AI блять?!',
                    'error'
                  );
                  keyInput.focus();
                  return;
                }

                isSending = true;
                input.value = '';
                input.disabled = true;
                sendBtn.disabled = true;

                const userMessage = {
                  role: 'user',
                  content: text
                };

                selected.messages.push(userMessage);

                if (selected.title === 'Новый чат') {
                  selected.title = text.slice(0, 40) +
                    (text.length > 40 ? '…' : '');
                }

                selected.updatedAt = Date.now();
                saveChats();
                renderChat();

                const loading = appendMsg('Я думаю блять…', 'bot');

                try {
                  const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                      'X-App-Token': appToken,
                      'Content-Type': 'application/json'
                    },
                                        body: JSON.stringify({
                      messages: [
                        ...(localStorage.getItem(ANDI_MEMORY_KEY) !== 'false'
                          ? [{
                              role: 'system',
                              content: ANDRIALFUS_SYSTEM_PROMPT
                            }]
                          : []),
                        ...selected.messages.map(message => ({
                          role: message.role,
                          content: message.content
                        }))
                      ]
                    })
                  });

                  const rawBody = await response.text();
                  let data;

                  try {
                    data = JSON.parse(rawBody);
                  } catch (_) {
                    throw new Error(
                      'Сервер вернул непонятный ответ (HTTP ' +
                      response.status + ').'
                    );
                  }

                  if (!response.ok) {
                    const apiMessage =
                      (data && data.error &&
                        (data.error.message || data.error)) ||
                      (data && data.message) ||
                      ('HTTP ' + response.status);

                    throw new Error(String(apiMessage));
                  }

                  const reply = data &&
                    data.choices &&
                    data.choices[0] &&
                    data.choices[0].message &&
                    data.choices[0].message.content;

                  if (typeof reply !== 'string' || !reply.trim()) {
                    throw new Error(
                      'API ответил, но текст ответа отсутствует.'
                    );
                  }

                  loading.remove();

                  selected.messages.push({
                    role: 'assistant',
                    content: reply.trim()
                  });

                  selected.updatedAt = Date.now();
                  saveChats();
                  renderChat();

                } catch (error) {
                  loading.remove();

                  const lastMessage = selected.messages[
                    selected.messages.length - 1
                  ];

                  if (
                    lastMessage &&
                    lastMessage.role === 'user' &&
                    lastMessage.content === text
                  ) {
                    selected.messages.pop();
                    saveChats();
                  }

                  console.error('Utopia AI request failed:', error);

                  appendMsg(
                    'Нет ответа🤷😥: ' +
                    (error && error.message
                      ? error.message
                      : 'неизвестная ошибка') +
                      +
                    '\n\nПроверь интернет, токен доступа и доступность сервера Utopia AI.',
                    'error'
                  );

                } finally {
                  isSending = false;
                  input.disabled = false;
                  sendBtn.disabled = false;
                  input.focus();
                }
              }

              loadChats();
              renderChat();
            </script>
          </body>
          </html>
          EOF

          cat << 'EOF' > package.json
          {
            "name": "utopia-ai",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.squidfried.utopiaai",
            "appName": "Utopia AI",
            "webDir": "www"
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Initialize Capacitor Android
        run: |
          npx cap init "Utopia AI" "com.squidfried.utopiaai" --web-dir=www
          npx cap add android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"

      - name: Setup Custom Icon
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-mdpi
            cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_COMMANDLINE_TOOLS_HOME=/usr/local/lib/android/sdk/cmdline-tools/latest" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || echo "Licenses handled"

      - name: Compile Personal APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Export Ready App File
        uses: actions/upload-artifact@v4
        with:
          name: utopia-app
          path: android/app/build/outputs/apk
